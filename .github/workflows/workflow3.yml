name: Production Deploy Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
    # Evita ejecuciones absurdas si solo modificáis memorias o configs de CI
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
      - 'ANALISIS_CALIDAD.md'
      - 'INFO.md'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.project.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Generate tag from pom.xml
        id: project
        run: echo "tag=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Generate Docker image
        run: mvn spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName=${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ steps.project.outputs.tag }}

      - name: Run container in background
        run: docker run -d --name banking-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ steps.project.outputs.tag }}

      # Ejecución del SmokeTest de Selenium usando un servidor virtual Xvfb en el runner local
      - name: Smoke test on runner
        run: |
          sleep 30
          xvfb-run -a mvn test -Dtest='es.codeurjc.e2e.SmokeTest' -DAPP_URL=http://localhost:8080 -DAPP_VERSION=${{ steps.project.outputs.tag }}

      - name: Stop and remove container
        run: |
          docker stop banking-app
          docker rm banking-app

      - name: Login to DockerHub
        run: docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Push image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ steps.project.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Update Container App'
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ needs.build.outputs.version }}

      # Captura de la URL de Azure y ejecución de la prueba de humo apuntando directo a producción
      - name: 'Smoke test on Azure'
        run: |
          FQDN=$(az containerapp show --name ${{ vars.AZURE_CONTAINER_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          sleep 30
          xvfb-run -a mvn test -Dtest='es.codeurjc.e2e.SmokeTest' -DAPP_URL=https://$FQDN -DAPP_VERSION=${{ needs.build.outputs.version }}