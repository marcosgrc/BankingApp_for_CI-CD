name: Feature Tests Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'

  workflow_dispatch:

jobs:
  feature-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test -P unit-tests

      - name: Run system tests
        run: xvfb-run -a mvn test -Dtest='es.codeurjc.e2e.*Test'
