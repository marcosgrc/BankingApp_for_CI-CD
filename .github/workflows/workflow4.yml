name: Nightly Cross-Browser Workflow

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:
  cross-browser-e2e:
    name: E2E (${{ matrix.browser }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: chrome
            os: windows-latest
          - browser: chrome
            os: macos-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: firefox
            os: windows-latest
          - browser: firefox
            os: macos-latest
          - browser: edge
            os: windows-latest
          - browser: safari
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Safari for WebDriver
        if: matrix.browser == 'safari'
        run: |
          pkill -x Safari 2>/dev/null || true
          safaridriver --enable || sudo safaridriver --enable
          defaults write com.apple.Safari AllowRemoteAutomation 1
          defaults write com.apple.Safari IncludeDevelopMenu 1
          defaults write com.apple.Safari.autofill.autoFillPasswords -bool false
          defaults write com.apple.Safari AutoOpenSafeDownloads -bool false

      - name: Run system test (transfer between own accounts)
        env:
          BROWSER: ${{ matrix.browser }}
        shell: bash
        run: |
          TEST='es.codeurjc.e2e.TransferE2ETest#testTransferOwnAccountsSuccess'
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a mvn test -Dtest="$TEST"
          else
            mvn test -Dtest="$TEST"
          fi

  publish-nightly:
    name: Publish nightly Docker image
    runs-on: ubuntu-latest
    needs: cross-browser-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate nightly tag
        id: nightly
        run: echo "tag=nightly-$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          mvn spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName=${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ steps.nightly.outputs.tag }}

      - name: Login to DockerHub
        run: docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Push nightly image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ steps.nightly.outputs.tag }}
